# Broadway Opticals — nginx front end for the Next.js standalone server.
#
# Install with:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/broadway
#   sudo ln -sf /etc/nginx/sites-available/broadway /etc/nginx/sites-enabled/broadway
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Hero banner video is capped at 64 MB in the route handler; nginx needs
    # headroom above that or it rejects the request with a 413 before the
    # handler ever sees it and can return a readable error.
    client_max_body_size 80M;

    # A 64 MB upload over a slow line takes a while — the defaults (60s) cut
    # it off mid-transfer.
    proxy_request_buffering off;
    client_body_timeout 300s;

    # Don't advertise the exact nginx build.
    server_tokens off;

    # Immutable build assets — hashed filenames, so they can be cached hard and
    # served straight off disk without waking the Node process.
    location /_next/static/ {
        alias /var/www/broadway/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /uploads/ {
        alias /var/www/broadway/public/uploads/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Next reads the forwarded headers to build absolute URLs and to rate
        # limit by real client IP; without them every caller looks like 127.0.0.1.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
